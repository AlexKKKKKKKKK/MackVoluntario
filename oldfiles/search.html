<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MackVoluntario</title>

    <link rel="stylesheet" href="./src/styles/main.css">
    <link rel="stylesheet" href="./src/styles/search.css">
</head>
<body>
    <header class="navbar">
        <a href="./index.html" class="brand">
            <img src="./src/commons/M_vermelho.png" alt="Mack Logo" class="brand-logo">
            <span>MackVoluntário</span>
        </a>
        <ul class="nav-links">
            <li><a href="./search.html">Projetos</a></li>
            <li><a href="#">Sobre</a></li>
            <li><a href="#">Contato</a></li>
            <li><a href="#" class="btn-login">Entrar</a></li>
        </ul>
    </header>

    <main class="container">
        <section class="search-header">
            <h1>Resultados da busca</h1>
            <p>Encontre oportunidades de voluntariado que combinam com seus interesses e habilidades.</p>
        </section>

        <!-- Os botões são criados pelo search.js a partir das categorias dos projetos -->
        <section class="filter-section" id="filter-section" aria-label="Filtrar por categoria"></section>

        <form id="search-form" class="search-form">
            <input
                type="text"
                id="search-input"
                placeholder="Buscar projetos por tema, local ou horário"
                aria-label="Buscar projetos"
                autocomplete="off"
            >
            <button type="submit" class="search-button">Buscar</button>
        </form>

        <!-- Os cards são criados pelo search.js -->
        <section id="cards-section" class="cards-section"></section>
    </main>

    <script type="module" src="./src/scripts/search.js"></script>
</body>
</html>
