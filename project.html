<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MackVoluntario</title>

    <link rel="stylesheet" href="./src/styles/project.css">
</head>
<body>
    <header class="navbar">
        <a href="./index.html" class="brand">
            <img src="./src/commons/M_vermelho.png" alt="Mack Logo" class="brand-logo">
            <span>MackVoluntário</span>
        </a>
        <ul class="nav-links">
            <li><a href="#">Projetos</a></li>
            <li><a href="#">Sobre</a></li>
            <li><a href="#">Contato</a></li>
            <li><a href="#" class="btn-login">Entrar</a></li>
        </ul>
    </header>

    <main class="container">
    <section class="hero-banner">
        <span class="category-badge" id="category"></span>
        <img id="hero-image" src="" alt="">
    </section>

    <section class="project-header">
        <h1 class="project-title" id="title"></h1>
        <p class="project-subtitle" id="subtitle"></p>
    </section>

    <section class="info-grid">
        <div class="info-card">
            <span class="info-card-label">Horário</span>
            <span class="info-card-value" id="schedule"></span>
        </div>

        <div class="info-card">
            <span class="info-card-label">Local</span>
            <span class="info-card-value" id="location"></span>
        </div>

        <div class="info-card">
            <span class="info-card-label">Vagas</span>
            <span class="info-card-value" id="spots"></span>
        </div>

        <div class="info-card">
            <span class="info-card-label">Duração</span>
            <span class="info-card-value" id="duration"></span>
        </div>
    </section>

    <section class="about-section">
        <h2>Sobre o projeto</h2>
        <p id="description"></p>
        <p id="additional-info"></p>
    </section>
    </main>

    <script type="module" src="./src/scripts/project.js"></script>
</body>
</html>
